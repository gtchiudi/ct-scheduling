apiVersion: batch/v1
kind: CronJob
metadata:
  name: flush-expired-tokens
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: flush-expired-tokens
            image: $(CTSCHEDULING_IMAGE)
            env:
              - name: MYSQL_DATABASE
                valueFrom:
                  secretKeyRef:
                    name: ctscheduling-env-secret
                    key: MYSQL_DATABASE
              - name: MYSQL_USER
                valueFrom:
                  secretKeyRef:
                    name: ctscheduling-env-secret
                    key: MYSQL_USER
              - name: MYSQL_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ctscheduling-env-secret
                    key: MYSQL_PASSWORD
              - name: MYSQL_HOST
                valueFrom:
                  secretKeyRef:
                    name: ctscheduling-env-secret
                    key: MYSQL_HOST
              - name: ENABLE_MYSQL
                valueFrom:
                  secretKeyRef:
                    name: ctscheduling-env-secret
                    key: ENABLE_MYSQL
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prune-audit-logs
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: prune-audit-logs
            image: $(CTSCHEDULING_IMAGE)
            env:
              - name: MYSQL_DATABASE
                valueFrom:
                  secretKeyRef:
                    name: ctscheduling-env-secret
                    key: MYSQL_DATABASE
              - name: MYSQL_USER
                valueFrom:
                  secretKeyRef:
                    name: ctscheduling-env-secret
                    key: MYSQL_USER
              - name: MYSQL_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ctscheduling-env-secret
                    key: MYSQL_PASSWORD
              - name: MYSQL_HOST
                valueFrom:
                  secretKeyRef:
                    name: ctscheduling-env-secret
                    key: MYSQL_HOST
              - name: ENABLE_MYSQL
                valueFrom:
                  secretKeyRef:
                    name: ctscheduling-env-secret
                    key: ENABLE_MYSQL
              # Retention in days; leave unset in the secret to keep audit history forever.
              - name: AUDIT_RETENTION_DAYS
                valueFrom:
                  secretKeyRef:
                    name: ctscheduling-env-secret
                    key: AUDIT_RETENTION_DAYS
                    optional: true
              - name: NOTIFICATION_RETENTION_DAYS
                valueFrom:
                  secretKeyRef:
                    name: ctscheduling-env-secret
                    key: NOTIFICATION_RETENTION_DAYS
                    optional: true
